cucumber.glue=stepdefinitions
cucumber.filter.tags=@e2e
cucumber.plugin=pretty, html:target/cucumber-reports/cucumber.html, json:target/cucumber-reports/cucumber.json, io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm

# Parallel execution. The DriverFactory keeps one AndroidDriver per thread,
# so scenarios are thread-safe. Parallelism defaults to 1 (sequential) because
# each Android session needs its own device/emulator — bump this to match the
# number of connected devices, e.g.:
#   mvn test -Dcucumber.execution.parallel.config.fixed.parallelism=3
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=1
