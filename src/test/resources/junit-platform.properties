cucumber.glue=stepdefinitions
cucumber.filter.tags=@e2e
cucumber.plugin=pretty, html:target/cucumber-reports/cucumber.html, json:target/cucumber-reports/cucumber.json, io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm

# Parallel execution is OFF by default so the suite runs out-of-the-box against
# a single emulator/device (multiple UiAutomator2 sessions on one device fail to
# initialise their instrumentation). The DriverFactory already keeps one
# AndroidDriver per thread, so on a multi-device setup you can opt in at runtime:
#
#   mvn test -Dcucumber.execution.parallel.enabled=true \
#            -Dcucumber.execution.parallel.config.fixed.parallelism=3
#
cucumber.execution.parallel.enabled=false
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=1
